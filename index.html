<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#62bdb2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>誰是天選之人？｜抽籤轉盤</title>
<script>
window.MathJax = { tex: { inlineMath: [['\\(','\\)'], ['$', '$']] }, svg: { fontCache: 'global' } };
</script>

<style>
*{box-sizing:border-box}
:root{--bg:#fffaf2;--mint:#62bdb2;--mint2:#a9d8ce;--pink:#f5c7c7;--yellow:#ffe16a;--cream:#fffdf8;--ink:#454a49;--line:#eadfd2}
html,body{margin:0;min-height:100%;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--bg)}
body{overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:
radial-gradient(circle at 2% 7%,#6fc5bb 0 2px,transparent 3px) 0 0/18px 18px,
radial-gradient(circle at 96% 12%,#f2b6b6 0 80px,transparent 81px),
radial-gradient(circle at 5% 95%,#ffe16a 0 100px,transparent 101px),
radial-gradient(circle at 94% 94%,#9ed7ce 0 120px,transparent 121px);opacity:.9}
.app{position:relative;z-index:1;width:min(1600px,100%);min-height:100vh;margin:auto;padding:26px 42px 24px}
h1{margin:0 0 18px 52px;color:#57b8ad;font-size:clamp(48px,5vw,82px);font-weight:1000;letter-spacing:2px;line-height:1.05}
.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(420px,.92fr);gap:34px;align-items:start}
.card{background:rgba(255,253,248,.96);border:2px solid var(--line);border-radius:24px;box-shadow:0 8px 24px rgba(100,85,70,.10)}
.wheel-card{border:0;background:transparent;box-shadow:none;min-height:700px;display:flex;flex-direction:column;justify-content:center;padding:0}
.wheel-wrap{position:relative;display:flex;justify-content:center;align-items:center;min-height:650px}
canvas{display:block;width:min(55vw,680px);height:min(55vw,680px);max-width:680px;max-height:680px}
.pointer{position:absolute;left:2.5%;top:50%;transform:translateY(-50%);z-index:4;width:0;height:0;border-top:34px solid transparent;border-bottom:34px solid transparent;border-left:88px solid #55595a;filter:drop-shadow(4px 4px 0 rgba(255,255,255,.8))}
.wheel-stand{position:absolute;bottom:0;width:180px;height:95px;background:#55595a;clip-path:polygon(30% 0,70% 0,88% 100%,12% 100%);z-index:0}.wheel-wrap canvas{position:relative;z-index:1}.center{position:absolute;width:78px;height:78px;border-radius:50%;background:#5f6464;border:5px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:1000;box-shadow:0 4px 8px #0002;z-index:3}
.controls{text-align:center;margin-top:-10px}
.result{min-height:35px;font-size:22px;font-weight:900;color:#626665}
.primary{border:0;background:var(--yellow);color:#4e5050;font-size:22px;font-weight:1000;padding:15px 56px;border-radius:18px;box-shadow:0 4px 0 #d7ba3f;cursor:pointer}
.primary:disabled{opacity:.6;cursor:not-allowed}
.reset-wheel{margin-top:16px;align-self:flex-start;background:#65c1b7;color:#fff;border:0;border-radius:18px;padding:12px 28px;font-size:17px;font-weight:1000;box-shadow:0 3px 0 #4fa69d;cursor:pointer}
.status{margin-top:10px;text-align:center;color:#777;font-size:13px}
.right-col{display:flex;flex-direction:column;gap:18px}
.settings{overflow:hidden}
.settings-head{background:linear-gradient(90deg,#55b8ae,#72c4ba);color:#fff;padding:18px 24px;font-size:27px;font-weight:1000}
.settings-body{padding:17px 25px 22px}
.settings h3{margin:13px 0 7px;font-size:18px}
.row{display:flex;align-items:center;gap:10px;margin:11px 0}
.row label{font-weight:900;white-space:nowrap}
input[type=number],input[type=text]{border:2px solid #e8e2da;background:#fff;border-radius:11px;padding:10px 12px;font-size:16px;color:#555;outline:none}
input:focus{border-color:#78c8bf;box-shadow:0 0 0 3px #9edbd355}
.small{font-size:12px;color:#8b8d8b;line-height:1.5}
.section-line{height:1px;background:#eee7df;margin:15px 0}
.toggle{display:flex;align-items:center;gap:8px;margin:12px 0;font-weight:800}
.toggle input{accent-color:#5bb9af;width:18px;height:18px}
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}
.action-row button,.reset-weights{border:0;border-radius:14px;padding:11px;font-size:15px;font-weight:1000;cursor:pointer}
.action-row button:first-child{background:#f6cccc;color:#d56d6d}
.action-row button:last-child{background:#c6e4de;color:#428f87}
#addBtn{border:0;border-radius:11px;background:#64bdb3;color:#fff;padding:10px 16px;font-weight:1000;cursor:pointer}
.status{background:#f8f2e9;border-radius:12px;padding:8px}
.number-grid{display:none;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:10px}
.number-grid.show{display:grid}
.num{padding:5px 1px;text-align:center;border-radius:6px;background:#edf5f2;font-size:11px}
.num.used{background:#ece9e4;color:#aaa;text-decoration:line-through}
.num.multi{background:#fff0b0;color:#a57d00;font-weight:900}
.history{padding:18px 22px}
.history h2{margin:0 0 11px;font-size:22px}
.history-list{max-height:140px;overflow:auto;background:#fff;border:1px solid #eee7df;border-radius:12px}
.history-item{padding:9px 11px;border-bottom:1px solid #eee;font-weight:900}
#clearHistory{margin-top:11px;border:0;background:#f6cccc;color:#d56d6d;border-radius:12px;padding:9px 16px;font-weight:1000;cursor:pointer}
.win-overlay{position:fixed;inset:0;background:rgba(255,250,242,.86);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:50;opacity:0;pointer-events:none;transition:opacity .22s}
.win-overlay.show{opacity:1;pointer-events:auto}
.win-box{text-align:center;transform:scale(.45);transition:transform .45s cubic-bezier(.2,1.45,.4,1);position:relative}
.win-overlay.show .win-box{transform:scale(1)}
.win-label{font-size:clamp(42px,5vw,72px);font-weight:1000;color:#505554}
.win-number{font-size:clamp(160px,20vw,290px);line-height:.9;font-weight:1000;color:#65c1b7;-webkit-text-stroke:7px #fff;text-shadow:8px 10px 0 #d9cfc4}
.confetti{position:absolute;inset:-100px;z-index:-1;background-image:radial-gradient(circle,#f5a5a5 0 5px,transparent 6px),radial-gradient(circle,#ffe16a 0 5px,transparent 6px),radial-gradient(circle,#91d1c7 0 5px,transparent 6px);background-position:10% 20%,85% 15%,80% 80%;background-size:100px 100px,130px 130px,120px 120px}
@media(max-width:1050px){.app{padding:20px}.layout{grid-template-columns:1fr}.wheel-card{min-height:auto}.wheel-wrap{min-height:500px}canvas{width:min(78vw,620px);height:min(78vw,620px)}}
@media(max-width:600px){.app{padding:14px}h1{margin-left:10px;font-size:40px}.layout{gap:15px}.wheel-wrap{min-height:380px}canvas{width:88vw;height:88vw}.pointer{border-top-width:22px;border-bottom-width:22px;border-left-width:58px}.settings-body{padding:15px}.number-grid{grid-template-columns:repeat(8,1fr)}}
</style>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));}</script>
</head>
<body>
<div class="app">
<h1>誰是天選之人？</h1>


<div class="layout">
<section class="card wheel-card">
  <div class="wheel-wrap"><div class="wheel-stand"></div>
    <div class="pointer"></div>
    <canvas id="wheel" width="700" height="700"></canvas>
    <div class="center" id="center">?</div>
  </div>
  <div class="controls">
    <div class="result" id="result">準備開始</div>
    <button class="primary" id="spinBtn">🎯 開始抽籤</button>
  </div>
  <button class="reset-wheel" id="resetWheel">↻　重置轉盤</button>
  <div class="status" id="status"></div>
</section>

<aside class="right-col">
<section class="card settings">
  <div class="settings-head">⚙️ 抽籤設定</div>
  <div class="settings-body">
  <div class="row">
    <label>號碼範圍</label>
    <div style="display:flex;align-items:center;gap:6px">
      <input id="rangeMin" type="number" min="1" max="46" value="1" style="width:65px">
      <span>～</span>
      <input id="rangeMax" type="number" min="1" max="46" value="46" style="width:65px">
    </div>
  </div>
  <div class="row">
    <label>剔除號碼</label>
    <input id="excludeNums" type="text" placeholder="例如：3, 8, 15" style="flex:1;min-width:0">
  </div>
  <div class="small" style="margin:-5px 0 12px">輸入要剔除的號碼，用逗號、空白或頓號分隔，例如：3, 8, 15</div>
  <div class="row">
    <label>一次抽幾個</label>
    <input id="drawCount" type="number" min="1" max="46" value="1">
  </div>
  <div class="toggle">
    <input id="removeDrawn" type="checkbox" checked>
    <label for="removeDrawn">抽中後移除，不再抽到</label>
  </div>
  <hr>
  <h3>增加號碼的數量</h3>
  <div class="row">
    <label>號碼</label>
    <input id="targetNum" type="text" value="1" placeholder="例如：3 或 3,8,15" style="flex:1;min-width:0">
  </div>
  <div class="small" style="margin:-5px 0 12px">可輸入單個或多個號碼，例如：3 或 3, 8, 15</div>
  <div class="row">
    <label>每個號碼增加</label>
    <input id="addQty" type="number" min="1" max="99" value="1">
    <button id="addBtn">增加</button>
  </div>
  <div class="action-row">
    <button id="clearHistoryTop">🗑　清空紀錄</button>
    <button id="showList">☷　完整名單</button>
  </div>
  <div class="action-row" style="display:none"><button id="resetWeights">恢復全部 ×1</button><button id="resetAll">全部重置</button></div>
  <div class="small">機率：\(P(i)=\frac{w_i}{\sum_{j=1}^{46}w_j}\)</div>
  <div class="number-grid" id="numberGrid"></div>
  </div>
</section>

<section class="card history" style="margin-top:22px">
  <h2>📋 抽籤紀錄</h2>
  <div id="history" class="history-list"><div class="small">尚無紀錄</div></div>
  <button id="clearHistory" style="margin-top:12px">🗑　清空紀錄</button>
</section>
</aside>
</div>
</div>

<script>
const N=46;
let weights=Array(N).fill(1);
let active=Array(N).fill(true);
let history=[];
let spinning=false;
let angle=0;

const canvas=document.getElementById('wheel'), ctx=canvas.getContext('2d');
const spinBtn=document.getElementById('spinBtn');

function getRange(){
  let min=parseInt(document.getElementById('rangeMin').value)||1;
  let max=parseInt(document.getElementById('rangeMax').value)||46;
  min=Math.max(1,Math.min(46,min));
  max=Math.max(1,Math.min(46,max));
  if(min>max)[min,max]=[max,min];
  document.getElementById('rangeMin').value=min;
  document.getElementById('rangeMax').value=max;
  return {min,max};
}
function getExcluded(){
  const raw=document.getElementById('excludeNums').value;
  return new Set((raw.match(/\d+/g)||[]).map(Number).filter(n=>n>=1&&n<=46));
}
function activeEntries(){
  const {min,max}=getRange();
  const excluded=getExcluded();
  const a=[];
  for(let i=min-1;i<max;i++) if(active[i] && !excluded.has(i+1))
    for(let k=0;k<weights[i];k++) a.push(i+1);
  return a;
}
function drawWheel(){
  const entries=activeEntries();
  ctx.clearRect(0,0,700,700);
  if(!entries.length){
    ctx.beginPath();ctx.arc(350,350,315,0,Math.PI*2);ctx.fillStyle="#eceff1";ctx.fill();
    ctx.fillStyle="#78909c";ctx.font="bold 30px sans-serif";ctx.textAlign="center";ctx.fillText("沒有可抽的號碼",350,360);
    updateStatus(); return;
  }
  const r=315, cx=350, cy=350, step=Math.PI*2/entries.length;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);
  for(let i=0;i<entries.length;i++){
    const a0=i*step, a1=(i+1)*step;
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,a0,a1);ctx.closePath();
    const palette=["#fffaf0","#f6c9c9","#ffe16a","#a8d7cd"];
    ctx.fillStyle=palette[i%palette.length];ctx.fill();
    ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();
    ctx.save();ctx.rotate((a0+a1)/2);ctx.textAlign="right";ctx.fillStyle="#263238";
    const fs=entries.length>70?15:entries.length>45?18:22;
    ctx.font=`900 ${fs}px sans-serif`;ctx.fillText(entries[i],r-14,fs/3);ctx.restore();
  }
  ctx.restore();
  ctx.beginPath();ctx.arc(cx,cy,315,0,Math.PI*2);ctx.strokeStyle="#3949ab";ctx.lineWidth=7;ctx.stroke();
  updateStatus();
}
function updateStatus(){
  const {min,max}=getRange();
  const excluded=getExcluded();
  const total=activeEntries().length;
  let unique=0;
  for(let i=min-1;i<max;i++) if(active[i] && !excluded.has(i+1)) unique++;
  const excludedText=[...excluded].sort((a,b)=>a-b).join('、');
  document.getElementById('status').innerHTML=`範圍 <b>${min}～${max}</b>｜剩餘 <b>${unique}</b> 個不同號碼｜轉盤籤數 <b>${total}</b>${excludedText?`<br><span class="small">已剔除：${excludedText}</span>`:''}`;
  renderGrid();
}
function renderGrid(){
  const g=document.getElementById('numberGrid');g.innerHTML='';
  for(let i=1;i<=N;i++){
    const d=document.createElement('div');d.className='num'+(!active[i-1]?' used':'')+(weights[i-1]>1&&active[i-1]?' multi':'');
    d.textContent=active[i-1]?`${i}${weights[i-1]>1?' ×'+weights[i-1]:''}`:`${i} ✓`;
    g.appendChild(d);
  }
}
function weightedPick(pool){
  return pool[Math.floor(Math.random()*pool.length)];
}
function pickMany(count){
  let pool=activeEntries(), out=[];
  for(let k=0;k<count && pool.length;k++){
    const picked=weightedPick(pool), idx=pool.indexOf(picked);
    out.push(picked); pool.splice(idx,1);
    if(document.getElementById('removeDrawn').checked) {
      active[picked-1]=false;
      pool=pool.filter(x=>x!==picked);
    }
  }
  return out;
}
function spin(){
  if(spinning)return;
  const count=Math.max(1,Math.min(46,parseInt(document.getElementById('drawCount').value)||1));
  const unique=active.filter(Boolean).length;
  if(unique===0){alert('已經沒有可抽的號碼，請重置。');return;}
  if(document.getElementById('removeDrawn').checked && count>unique){alert(`目前只剩 ${unique} 個不同號碼，無法一次抽 ${count} 個。`);return;}
  spinning=true;spinBtn.disabled=true;
  const picks=pickMany(count);
  const first=picks[0];
  const entriesBefore=activeEntries().concat(); // visual animation target is approximate
  const visualCount=Math.max(1,entriesBefore.length);
  const targetIndex=Math.floor(Math.random()*visualCount);
  const step=Math.PI*2/visualCount;
  const desired=-Math.PI/2-(targetIndex+0.5)*step;
  let delta=desired-angle;
  while(delta<0)delta+=Math.PI*2;
  delta+=Math.PI*2*(5+Math.random()*3);
  const start=angle, end=angle+delta, duration=2600;
  const t0=performance.now();
  function anim(t){
    const p=Math.min(1,(t-t0)/duration), e=1-Math.pow(1-p,4);
    angle=start+(end-start)*e;drawWheel();
    if(p<1)requestAnimationFrame(anim);else{
      spinning=false;spinBtn.disabled=false;
      document.getElementById('center').textContent=first;
      document.getElementById('result').textContent=picks.join('　→　');
      document.getElementById('winNumber').textContent=picks.join('、');
      const overlay=document.getElementById('winOverlay');
      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden','false');
      setTimeout(()=>{overlay.classList.remove('show');overlay.setAttribute('aria-hidden','true');},1800);
      history.unshift(picks);renderHistory();drawWheel();
    }
  }
  requestAnimationFrame(anim);
}
function renderHistory(){
  const h=document.getElementById('history');
  h.innerHTML=history.length?history.map((x,i)=>`<div class="history-item"><b>第 ${history.length-i} 次</b>　${x.join('、')}</div>`).join(''):'<div class="small">尚無紀錄</div>';
}
document.getElementById('addBtn').onclick=()=>{
  const raw=document.getElementById('targetNum').value;
  const nums=[...new Set((raw.match(/\d+/g)||[]).map(Number).filter(n=>n>=1&&n<=N))];
  const q=parseInt(document.getElementById('addQty').value)||1;
  if(!nums.length||q<1)return;
  nums.forEach(n=>{weights[n-1]+=q; active[n-1]=true;});
  drawWheel();
};
document.getElementById('resetWeights').onclick=()=>{weights=Array(N).fill(1);drawWheel();};
document.getElementById('resetAll').onclick=()=>{
  weights=Array(N).fill(1);active=Array(N).fill(true);history=[];document.getElementById('center').textContent='?';document.getElementById('result').textContent='準備開始';renderHistory();drawWheel();
};
document.getElementById('clearHistory').onclick=()=>{history=[];renderHistory();};
spinBtn.onclick=spin;
document.getElementById('rangeMin').addEventListener('change',()=>{getRange();drawWheel();});
document.getElementById('rangeMax').addEventListener('change',()=>{getRange();drawWheel();});
document.getElementById('excludeNums').addEventListener('input',()=>{drawWheel();});
document.getElementById('drawCount').addEventListener('change',()=>{
  const unique=active.filter(Boolean).length;
  const el=document.getElementById('drawCount');
  el.value=Math.max(1,Math.min(46,parseInt(el.value)||1));
});
drawWheel();

document.getElementById('resetWheel')?.addEventListener('click',()=>{
  angle=0;
  document.getElementById('center').textContent='?';
  document.getElementById('result').textContent='準備開始';
  drawWheel();
});
document.getElementById('showList')?.addEventListener('click',()=>{
  const g=document.getElementById('numberGrid');
  g.classList.toggle('show');
  document.getElementById('showList').textContent=g.classList.contains('show')?'☷　隱藏名單':'☷　完整名單';
});
document.getElementById('clearHistoryTop')?.addEventListener('click',()=>{
  history=[];renderHistory();
});
</script>
<div class="win-overlay" id="winOverlay" aria-hidden="true"><div class="win-box"><div class="confetti"></div><div class="win-label">抽中！</div><div class="win-number" id="winNumber">23</div></div></div></body>
</html>
